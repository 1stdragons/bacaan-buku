<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bacaan Buku</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a5fb4">
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 Bacaan Buku</div>
    <div class="topbar-right">
      <span id="whoami" class="muted"></span>
      <button id="logoutBtn" class="btn btn-ghost">Keluar</button>
    </div>
  </header>

  <!-- ===================== TAMPILAN DOSEN ===================== -->
  <main id="dosenView" class="container hidden">
    <nav class="tabs tabs-nav">
      <button class="tab active" data-page="monitor">Monitoring</button>
      <button class="tab" data-page="docs">Dokumen</button>
      <button class="tab" data-page="students">Mahasiswa</button>
    </nav>

    <!-- Monitoring -->
    <section id="page-monitor" class="page">
      <div class="page-head">
        <h2>Monitoring Bacaan</h2>
        <a class="btn btn-secondary" href="/api/monitor/export">⬇ Ekspor CSV</a>
      </div>
      <div class="table-wrap">
        <table id="monitorTable" class="table">
          <thead></thead><tbody></tbody>
        </table>
      </div>
      <p class="muted" id="monitorEmpty"></p>
    </section>

    <!-- Dokumen -->
    <section id="page-docs" class="page hidden">
      <div class="page-head"><h2>Dokumen</h2></div>

      <div class="card">
        <h3>Tulis teks baru</h3>
        <form id="textDocForm">
          <div class="field">
            <label for="docJudul">Judul</label>
            <input type="text" id="docJudul" required placeholder="Judul bacaan">
          </div>
          <div class="field">
            <label for="docIsi">Isi bacaan</label>
            <textarea id="docIsi" rows="8" required placeholder="Tulis atau tempel tulisan di sini..."></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Simpan</button>
        </form>
      </div>

      <div class="card">
        <h3>Unggah PDF</h3>
        <form id="pdfDocForm">
          <div class="field">
            <label for="pdfJudul">Judul</label>
            <input type="text" id="pdfJudul" required placeholder="Judul bacaan">
          </div>
          <div class="field">
            <label for="pdfFile">File PDF</label>
            <input type="file" id="pdfFile" accept="application/pdf" required>
          </div>
          <button class="btn btn-primary" type="submit">Unggah</button>
        </form>
      </div>

      <div class="card">
        <h3>Daftar dokumen</h3>
        <div id="docList" class="doc-list"></div>
      </div>
    </section>

    <!-- Mahasiswa -->
    <section id="page-students" class="page hidden">
      <div class="page-head"><h2>Mahasiswa</h2></div>

      <div class="card">
        <h3>Tambah mahasiswa</h3>
        <form id="studentForm" class="inline-form">
          <input type="text" id="stNama" placeholder="Nama lengkap" required>
          <input type="text" id="stNim" placeholder="NIM" required>
          <button class="btn btn-primary" type="submit">Tambah</button>
        </form>
      </div>

      <div class="card">
        <h3>Impor massal</h3>
        <p class="muted">Satu baris per mahasiswa: <code>Nama, NIM</code></p>
        <textarea id="importArea" rows="5" placeholder="Budi Santoso, 2210511001&#10;Siti Aminah, 2210511002"></textarea>
        <button id="importBtn" class="btn btn-secondary" type="button">Impor</button>
      </div>

      <div class="card">
        <h3>Daftar mahasiswa</h3>
        <div class="table-wrap">
          <table class="table" id="studentTable">
            <thead><tr><th>Nama</th><th>NIM</th><th>Terdaftar</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- ===================== TAMPILAN MAHASISWA ===================== -->
  <main id="mhsView" class="container hidden">
    <div class="page-head"><h2>Daftar Bacaan Saya</h2></div>
    <div id="mhsDocs" class="doc-grid"></div>
    <p class="muted" id="mhsEmpty"></p>
  </main>

  <!-- Modal edit dokumen -->
  <div id="editModal" class="modal hidden">
    <div class="modal-box">
      <h3>Edit Dokumen</h3>
      <div class="field">
        <label for="editJudul">Judul</label>
        <input type="text" id="editJudul">
      </div>
      <div class="field" id="editKontenWrap">
        <label for="editKonten">Isi</label>
        <textarea id="editKonten" rows="10"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="editCancel">Batal</button>
        <button class="btn btn-primary" id="editSave">Simpan</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/js/app.js"></script>
</body>
</html>
